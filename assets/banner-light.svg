<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Kevin Marck — CS Student, Backend">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8ef7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4f8ef7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#000000" stroke-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Request routes: client → api → service → db -->
    <path id="r1" d="M712 190 H852 C877 190 877 110 902 110 H1002 C1022 110 1022 190 1042 190"/>
    <path id="r2" d="M712 190 H852 H1002 H1042"/>
    <path id="r3" d="M712 190 H852 C877 190 877 270 902 270 H1002 C1022 270 1022 190 1042 190"/>

    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .wire { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
      .flow { fill: none; stroke: url(#accent); stroke-width: 1.5; stroke-dasharray: 4 10; opacity: .55;
              animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .node { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
      .label { fill: #1f2328; font-size: 13px; }
      .tier { fill: #6e7781; font-size: 11px; letter-spacing: 2px; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { stroke: #d0d7de; } 50% { stroke: #4f8ef7; } }
    </style>
  </defs>

  <rect width="1200" height="380" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  <ellipse cx="870" cy="190" rx="330" ry="170" fill="url(#glow)"/>

  <!-- Left: identity -->
  <text x="72" y="118" class="mono" font-size="15" fill="#2563eb" letter-spacing="3">CS STUDENT · BACKEND</text>
  <text x="70" y="176" class="sans" font-size="52" font-weight="700" fill="#1f2328">Kevin Marck</text>
  <text x="72" y="220" class="sans" font-size="20" fill="#59636e">Architecture, OOP &amp; design patterns.</text>

  <g class="mono" font-size="14">
    <rect x="72" y="252" width="104" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="124" y="273" text-anchor="middle" fill="#1a7f37">Django</text>
    <rect x="186" y="252" width="72" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="222" y="273" text-anchor="middle" fill="#8250df">PHP</text>
    <rect x="268" y="252" width="62" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="299" y="273" text-anchor="middle" fill="#0969da">C#</text>
    <rect x="340" y="252" width="72" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="376" y="273" text-anchor="middle" fill="#bc4c00">SQL</text>
    <rect x="422" y="252" width="88" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="466" y="273" text-anchor="middle" fill="#9a6700">Python</text>
  </g>

  <text x="72" y="322" class="mono" font-size="13" fill="#6e7781">Switzerland</text>

  <!-- Right: architecture diagram -->
  <g class="mono">
    <!-- tier labels -->
    <text x="662" y="62" text-anchor="middle" class="tier">CLIENT</text>
    <text x="802" y="62" text-anchor="middle" class="tier">API</text>
    <text x="952" y="62" text-anchor="middle" class="tier">SERVICES</text>
    <text x="1087" y="62" text-anchor="middle" class="tier">DATA</text>

    <!-- wires -->
    <use xlink:href="#r1" href="#r1" class="wire"/>
    <use xlink:href="#r2" href="#r2" class="wire"/>
    <use xlink:href="#r3" href="#r3" class="wire"/>
    <use xlink:href="#r1" href="#r1" class="flow"/>
    <use xlink:href="#r2" href="#r2" class="flow"/>
    <use xlink:href="#r3" href="#r3" class="flow"/>

    <!-- requests (blue, forward) -->
    <g filter="url(#soft)">
      <circle r="3.5" fill="#4f8ef7">
        <animateMotion dur="3.2s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#r1" href="#r1"/></animateMotion>
      </circle>
      <circle r="3.5" fill="#4f8ef7">
        <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite"><mpath xlink:href="#r2" href="#r2"/></animateMotion>
      </circle>
      <circle r="3.5" fill="#7c5cff">
        <animateMotion dur="3.2s" begin="2.2s" repeatCount="indefinite"><mpath xlink:href="#r3" href="#r3"/></animateMotion>
      </circle>
      <!-- responses (green, backward) -->
      <circle r="3" fill="#1a7f37">
        <animateMotion dur="3.6s" begin="0.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#r3" href="#r3"/></animateMotion>
      </circle>
      <circle r="3" fill="#1a7f37">
        <animateMotion dur="3.6s" begin="2.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#r1" href="#r1"/></animateMotion>
      </circle>
    </g>

    <!-- nodes (drawn over packets so they look "processed") -->
    <rect x="612" y="170" width="100" height="40" rx="8" class="node"/>
    <text x="662" y="195" text-anchor="middle" class="label">browser</text>

    <rect x="752" y="166" width="100" height="48" rx="8" class="node pulse"/>
    <text x="802" y="187" text-anchor="middle" class="label">REST</text>
    <text x="802" y="203" text-anchor="middle" fill="#6e7781" font-size="10">/api/v1</text>

    <rect x="902" y="90" width="100" height="40" rx="8" class="node"/>
    <text x="952" y="115" text-anchor="middle" class="label">auth</text>
    <rect x="902" y="170" width="100" height="40" rx="8" class="node"/>
    <text x="952" y="195" text-anchor="middle" class="label">quotes</text>
    <rect x="902" y="250" width="100" height="40" rx="8" class="node"/>
    <text x="952" y="275" text-anchor="middle" class="label">users</text>

    <!-- database cylinder -->
    <g transform="translate(1042 160)">
      <path d="M0 10 V50 A45 10 0 0 0 90 50 V10" class="node"/>
      <ellipse cx="45" cy="10" rx="45" ry="10" class="node"/>
      <path d="M0 26 A45 10 0 0 0 90 26" fill="none" stroke="#d0d7de" stroke-width="1"/>
      <text x="45" y="47" text-anchor="middle" class="label">MySQL</text>
    </g>

    <!-- status -->
    <text x="872" y="330" text-anchor="middle" font-size="12" fill="#6e7781"><tspan fill="#1a7f37">●</tspan> 200 OK · request → response</text>
  </g>
</svg>
