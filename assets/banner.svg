<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Kevin Marck — Backend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="380" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Left: identity -->
  <text x="72" y="118" class="mono" font-size="15" fill="#4f8ef7" letter-spacing="3">BACKEND DEVELOPER</text>
  <text x="70" y="176" class="sans" font-size="52" font-weight="700" fill="#e6edf3">Kevin Marck</text>
  <text x="72" y="220" class="sans" font-size="20" fill="#8b949e">APIs, business web apps &amp; the data behind them.</text>

  <g class="mono" font-size="14">
    <rect x="72" y="252" width="104" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="124" y="273" text-anchor="middle" fill="#3fb950">Django</text>
    <rect x="186" y="252" width="72" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="222" y="273" text-anchor="middle" fill="#d2a8ff">PHP</text>
    <rect x="268" y="252" width="62" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="299" y="273" text-anchor="middle" fill="#79c0ff">C#</text>
    <rect x="340" y="252" width="72" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="376" y="273" text-anchor="middle" fill="#ffa657">SQL</text>
    <rect x="422" y="252" width="88" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="466" y="273" text-anchor="middle" fill="#e3b341">Python</text>
  </g>

  <text x="72" y="322" class="mono" font-size="13" fill="#6e7681">Switzerland · open to opportunities</text>

  <!-- Right: terminal -->
  <g transform="translate(640 64)">
    <rect width="488" height="252" rx="10" fill="#0d1117" stroke="#30363d"/>
    <path d="M0 10a10 10 0 0 1 10-10h468a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
    <circle cx="20" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="56" cy="18" r="5.5" fill="#27c93f"/>
    <text x="244" y="23" text-anchor="middle" class="mono" font-size="12" fill="#6e7681">~/work</text>

    <g class="mono" font-size="14">
      <text x="22" y="66"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> curl -s api/v1/dev | jq</tspan></text>
      <text x="22" y="94" fill="#e6edf3">{</text>
      <text x="22" y="118"><tspan fill="#79c0ff">  "role"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"backend"</tspan><tspan fill="#e6edf3">,</tspan></text>
      <text x="22" y="142"><tspan fill="#79c0ff">  "building"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"REST APIs"</tspan><tspan fill="#e6edf3">,</tspan></text>
      <text x="22" y="166"><tspan fill="#79c0ff">  "shipping"</tspan><tspan fill="#e6edf3">: [</tspan><tspan fill="#a5d6ff">"web apps"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">"tools"</tspan><tspan fill="#e6edf3">],</tspan></text>
      <text x="22" y="190"><tspan fill="#79c0ff">  "status"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#ffa657">200</tspan></text>
      <text x="22" y="214" fill="#e6edf3">}</text>
      <rect x="22" y="224" width="9" height="16" fill="#4f8ef7" class="cursor"/>
    </g>
  </g>
</svg>
